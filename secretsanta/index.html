<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta property="og:image" content="//dberzano.github.io/secretsanta/preview.jpg">
<title>Secret Santa</title>
<link href="https://fonts.googleapis.com/css?family=Emilys+Candy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="MersenneTwister.js"></script>
<script src="Cookies.js"></script>
<script src="SecretSanta.js"></script>
<script src="b64.js"></script>
<script>
async function init() {
    var q = Cookies.getQuery();
    var participants;
    var seed;
    var slug = q.get("slug");

    if (slug !== undefined) {
        if (q.has("w")) {
            q.delete("w");
            var cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete("w");
            window.history.replaceState(window.history.state, "", cleanUrl.href);
        }
        try {
            if (typeof slug !== "string" || !/^[A-Za-z0-9_-]+$/.test(slug)) {
                throw new Error("Invalid configuration slug");
            }
            var appPath = window.location.pathname
                .replace(/\/index\.html$/, "")
                .replace(/\/?$/, "/");
            var response = await fetch(appPath + "u/" + encodeURIComponent(slug) + "/config.json");
            if (!response.ok) throw new Error("Configuration not found");
            var config = await response.json();
            participants = config.participants;
            seed = config.seed === null ? parseInt(q.get("s")) : config.seed;
            if (!participants || typeof participants !== "object") {
                throw new Error("Invalid configuration data");
            }
        }
        catch (error) {
            new SecretSanta({}, NaN, document.getElementById("SecretSantaOutput"))
                .drawError("Impossibile caricare la configurazione");
            return;
        }
    }
    else {
        var encodedParticipants = q.get("w");
        participants = encodedParticipants === undefined ? {} : b64.decode(encodedParticipants);
        seed = parseInt(q.get("s"));
    }

    var ss = new SecretSanta(participants, seed, document.getElementById("SecretSantaOutput"));
    if (ss.valid) {
        if (q.get("reset")) {
            Cookies.unset(`giver-${ss.hashId}`);
            q.delete("reset");
            window.location.href = window.location.href.split("?")[0] + Cookies.genQueryString(q);
        }

        if (q.get("debug")) ss.drawPairs();
        else ss.drawLanding();
    }
    else {
        ss.drawError(ss.errorMessage);
    }
}
</script>
</head>
<body onload="init()">
<div id="Container">
  <div id="SecretSantaOutput"></div>
</div>
</body>
</html>
